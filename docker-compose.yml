name: forest-cover

services:
  backend:
    build:
      context: ./backend
    image: forest-cover-backend
    ports:
      - "8000:8000"
    environment:
      # Must contain the exact address you open the website at in your browser.
      CORS_ORIGINS: "http://localhost:5173,http://127.0.0.1:5173"

  frontend:
    build:
      context: ./frontend
      args:
        # Address of the API as seen from your BROWSER (baked in at build time).
        VITE_API_URL: "http://localhost:8000"
    image: forest-cover-frontend
    ports:
      - "5173:80"   # host 5173 -> nginx 80; 5173 is the origin the backend allows by default
    depends_on:
      backend:
        condition: service_healthy   # start the site only after the model has loaded