server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Fingerprinted build output (file names change when content changes): cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Forest photos and favicon (public/ folder): cache for a week.
    location /forests/ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Single-page app: the app uses BrowserRouter, so URLs like /predict or /results
    # don't exist as files. Fall back to index.html and let React Router handle them.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}