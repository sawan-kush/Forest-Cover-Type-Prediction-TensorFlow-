# Render blueprint for the API. Adjust the plan: TensorFlow needs enough RAM (>= 1 GB, 2 GB recommended).
services:
  - type: web
    name: forest-cover-api
    runtime: python
    rootDir: backend
    plan: standard
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CORS_ORIGINS
        sync: false   # set to your Vercel URL, e.g. https://your-app.vercel.app
